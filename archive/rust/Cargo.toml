[package]
name = "picture_spectrum"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
hound = "3.5"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
